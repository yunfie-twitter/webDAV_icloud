services:
  gateway:
    build: .
    image: icloud-webdav-gateway:local
    restart: unless-stopped
    command:
      - serve
      - --config
      - /data/icloud-webdav.toml
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --allow-insecure-remote
      - --non-interactive
    environment:
      ICLOUD_APPLE_ID: ${ICLOUD_APPLE_ID:?set ICLOUD_APPLE_ID}
      ICLOUD_PASSWORD: ${ICLOUD_PASSWORD:-}
      ICLOUD_WEBDAV_PASSWORD: ${ICLOUD_WEBDAV_PASSWORD:?set ICLOUD_WEBDAV_PASSWORD}
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/icloud_gateway
      VALKEY_URL: redis://valkey:6379/0
    volumes:
      - gateway-data:/data
      # Mount the directory rather than the socket inode. The broker unlinks
      # and recreates its socket on restart; a file bind mount would otherwise
      # leave the running container connected to the stale inode.
      - ${KEYBROKER_SOCKET_DIR:-/run/icloud-keybroker}:/run/keybroker:ro
    group_add:
      - ${KEYBROKER_GID:-10001}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [internal, edge]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_IP_SITES_DIR:-./caddy-ip-sites}:/etc/caddy/ip-sites:ro
      - ${MTLS_PKI_DIR:-./pki}/runtime:/etc/caddy/pki:ro
      - tailscale-socket:/var/run/tailscale
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN:?set the full MagicDNS name ending in .ts.net}
      TLS_DEFAULT_SNI: ${TS_IP_ADDRESS:-${TS_CERT_DOMAIN:?set the full MagicDNS name ending in .ts.net}}
    depends_on: [gateway, tailscale]

  # Temporary SFTP compatibility layer. It converts SFTP operations to the
  # existing internal WebDAV API, so encryption, locking, versioning, and GC
  # remain owned by the gateway. Enable explicitly with --profile sftp.
  sftp:
    image: rclone/rclone:1.74.2
    profiles: [sftp]
    restart: unless-stopped
    network_mode: service:tailscale
    entrypoint: ["/bin/sh", "/opt/icloud-sftp/start-sftp.sh"]
    environment:
      ICLOUD_WEBDAV_PASSWORD: ${ICLOUD_WEBDAV_PASSWORD:?set ICLOUD_WEBDAV_PASSWORD}
      SFTP_CACHE_SIZE: ${SFTP_CACHE_SIZE:-1G}
    volumes:
      - ./scripts/start-sftp.sh:/opt/icloud-sftp/start-sftp.sh:ro
      - ${SFTP_CONFIG_DIR:-./sftp}:/etc/icloud-sftp:ro
    tmpfs:
      - /runtime:rw,nosuid,nodev,noexec,size=16m,mode=0700
      - /cache:rw,nosuid,nodev,noexec,size=${SFTP_CACHE_SIZE:-1G},mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on: [gateway, tailscale]

  # Temporary implicit FTPS compatibility layer. The control connection is
  # TLS from the first byte on external port 990; passive data connections use
  # 30000-30009. It proxies all file operations through the encrypted gateway.
  ftps:
    image: rclone/rclone:1.74.2
    profiles: [ftps]
    restart: unless-stopped
    network_mode: service:tailscale
    entrypoint: ["/bin/sh", "/opt/icloud-ftps/start-ftps.sh"]
    environment:
      ICLOUD_WEBDAV_PASSWORD: ${ICLOUD_WEBDAV_PASSWORD:?set ICLOUD_WEBDAV_PASSWORD}
      ICLOUD_FTPS_PASSWORD: ${ICLOUD_FTPS_PASSWORD:-}
      FTPS_PUBLIC_IP: ${TS_IP_ADDRESS:-}
      FTPS_CACHE_SIZE: ${FTPS_CACHE_SIZE:-1G}
    volumes:
      - ./scripts/start-ftps.sh:/opt/icloud-ftps/start-ftps.sh:ro
      - ${MTLS_PKI_DIR:-./pki}/runtime:/etc/icloud-ftps/pki:ro
    tmpfs:
      - /runtime:rw,nosuid,nodev,noexec,size=16m,mode=0700
      - /cache:rw,nosuid,nodev,noexec,size=${FTPS_CACHE_SIZE:-1G},mode=0700
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on: [gateway, tailscale]

  # Preferred filesystem client mode. Samba serves an anonymous SMB2/SMB3
  # share backed by an rclone FUSE mount of the internal encrypted WebDAV API.
  # Port 445 is reachable only through the Tailscale network namespace.
  smb:
    build:
      context: .
      dockerfile: Dockerfile.smb
    image: icloud-webdav-smb:local
    profiles: [smb]
    restart: unless-stopped
    network_mode: service:tailscale
    environment:
      ICLOUD_WEBDAV_PASSWORD: ${ICLOUD_WEBDAV_PASSWORD:?set ICLOUD_WEBDAV_PASSWORD}
      SMB_CACHE_SIZE: ${SMB_CACHE_SIZE:-2G}
    volumes:
      - samba-state:/var/lib/samba
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    tmpfs:
      - /runtime:rw,nosuid,nodev,noexec,size=16m,mode=0700
      - /cache:rw,nosuid,nodev,noexec,size=${SMB_CACHE_SIZE:-2G},mode=0700
      - /var/cache/samba:rw,nosuid,nodev,noexec,size=16m,mode=0755
      - /var/log/samba:rw,nosuid,nodev,noexec,size=16m,mode=0755
      - /run/samba:rw,nosuid,nodev,noexec,size=16m,mode=0755
    read_only: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /srv/icloud && netstat -lnt | grep -q '127.0.0.1:1445'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on: [gateway, tailscale]

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:?run ./setup.sh to choose a privacy-safe hostname}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?run ./setup.sh to set an OAuth client secret}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:?run ./setup.sh to choose a privacy-safe hostname}
      TS_PERMIT_CERT_UID: "0"
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:?run ./setup.sh to set an approved tag}
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ${TS_SERVE_CONFIG_DIR:-./tailscale-config}:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks: [edge]

  auth:
    image: icloud-webdav-gateway:local
    profiles: [setup]
    entrypoint: ["icloud-webdav"]
    command:
      - auth
      - --config
      - /data/icloud-webdav.toml
      - --auth-method
      - ${ICLOUD_AUTH_METHOD:-sms}
    environment:
      ICLOUD_APPLE_ID: ${ICLOUD_APPLE_ID:?set ICLOUD_APPLE_ID}
      ICLOUD_PASSWORD: ${ICLOUD_PASSWORD:-}
    volumes:
      - gateway-data:/data
    networks: [edge]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: icloud_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d icloud_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

networks:
  internal:
    internal: true
  edge:

volumes:
  gateway-data:
  postgres-data:
  valkey-data:
  caddy-data:
  caddy-config:
  tailscale-state:
  tailscale-socket:
  samba-state:
