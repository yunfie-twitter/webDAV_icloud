[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-webdav-gateway"
version = "0.1.0"
description = "Post-quantum encrypted WebDAV gateway for iCloud Drive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "icloudpy==0.8.0",
  "cryptography>=47,<51",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<8",
  "tomli>=2,<3; python_version<'3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
icloud-webdav = "icloud_ftp.cli:main"
icloud-ftp = "icloud_ftp.cli:main"
icloud-keybroker = "icloud_ftp.keybroker_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
