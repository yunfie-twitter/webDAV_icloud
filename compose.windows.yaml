services:
  gateway:
    command:
      - serve
      - --config
      - /data/icloud-webdav.toml
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --allow-insecure-remote
      - --non-interactive
      - --key-broker-endpoint
      - https://host.docker.internal:9443
      - --key-broker-ca
      - /run/keybroker-pki/ca.pem
      - --key-broker-cert
      - /run/keybroker-pki/gateway.pem
      - --key-broker-key
      - /run/keybroker-pki/gateway-key.pem
    volumes: !override
      - gateway-data:/data
      - ${KEYBROKER_CA:?set KEYBROKER_CA}:/run/keybroker-pki/ca.pem:ro
      - ${KEYBROKER_CLIENT_CERT:?set KEYBROKER_CLIENT_CERT}:/run/keybroker-pki/gateway.pem:ro
      - ${KEYBROKER_CLIENT_KEY:?set KEYBROKER_CLIENT_KEY}:/run/keybroker-pki/gateway-key.pem:ro
    group_add: !reset []
    extra_hosts:
      - host.docker.internal:host-gateway
